{{define "content"}}
<div class="mx-auto max-w-4xl">
  <a href="/rekap" class="text-sm font-medium text-blue-600 hover:text-blue-700">&larr; Kembali ke Rekapitulasi</a>
  <div class="mt-4 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-blue-600">Rekap &amp; Laporan / Jurnal Mutasi</p>
      <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">Edit Mutasi</h1>
      <p class="mt-1 text-sm text-slate-500">Perubahan jurnal hanya dapat dilakukan oleh Admin.</p>
    </div>
    <span class="rounded-full border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-medium text-amber-700">Akses
      Admin</span>
  </div>
  <form method="post" action="/rekap/mutasi/{{.Mutation.ID}}/edit"
    class="mt-6 space-y-4 overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-medium">Barcode<input readonly
          value="{{.Mutation.Barcode}}"
          class="mt-1.5 w-full rounded-xl border bg-slate-50 px-3 py-2.5 font-mono"></label><label
        class="text-sm font-medium">SKU/PLU<input readonly value="{{.Mutation.Code}}"
          class="mt-1.5 w-full rounded-xl border bg-slate-50 px-3 py-2.5 font-mono"></label></div>
    <label class="block text-sm font-medium">Nama produk<input name="product_name" required
        value="{{.Mutation.ProductName}}" class="mt-1.5 w-full rounded-xl border px-3 py-2.5"></label>
    <label class="block text-sm font-medium">Lokasi Perpindahan<select name="direction"
        class="mt-1.5 w-full rounded-xl border px-3 py-2.5">
        <option value="counter_to_market" {{if eq .Mutation.Direction "market_to_counter" }}{{else}}selected{{end}}>
          Konter → Market</option>
        <option value="market_to_counter" {{if eq .Mutation.Direction "market_to_counter" }}selected{{end}}>Market →
          Konter</option>
      </select></label>
    <div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-medium">Qty<input name="qty" type="number" min="1"
          max="999" required value="{{.Mutation.Qty}}"
          class="mt-1.5 w-full rounded-xl border px-3 py-2.5"></label><label class="text-sm font-medium">Nama BA<input
          name="ba_name" value="{{with .Mutation.BAName}}{{.}}{{end}}"
          class="mt-1.5 w-full rounded-xl border px-3 py-2.5"></label></div>
    <div class="flex justify-end gap-2 border-t pt-4"><a href="/rekap"
        class="rounded-xl border px-4 py-2.5 text-sm">Batal</a><button
        class="rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white">Simpan Perubahan</button></div>
  </form>
</div>
{{end}}
