{{define "content"}}
<div class="mx-auto max-w-4xl">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <a href="/master-data" class="hover:text-blue-600">Master Data</a><span>/</span><span>Edit Produk</span>
      </div>
      <h1 class="mt-2 text-2xl font-bold tracking-tight">Edit Produk</h1>
      <p class="mt-1 text-sm text-slate-500">Perbarui informasi produk dan outlet yang memiliki produk ini.</p>
    </div>
    <a href="/master-data"
      class="inline-flex items-center rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">Kembali
      ke Master Data</a>
  </div>

  <form method="post" action="/master-data/{{.Product.ID}}"
    class="mt-6 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="border-b border-slate-200 bg-slate-50/70 px-6 py-5">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h2 class="font-semibold text-slate-900">Informasi Produk</h2>
          <p class="mt-1 text-sm text-slate-500">Pastikan barcode dan kode sesuai data fisik.</p>
        </div>
        <span class="rounded-full bg-blue-50 px-3 py-1 font-mono text-xs font-medium text-blue-700">ID
          #{{.Product.ID}}</span>
      </div>
    </div>
    <div class="grid gap-5 p-6 md:grid-cols-2">
      <label class="block text-sm font-medium text-slate-700 md:col-span-2">Outlet Produk
        <select name="outlet_id" required
          class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
          {{range .Outlets}}<option value="{{.ID}}" {{if eq .ID $.Product.OutletID}}selected{{end}}>{{.Name}}</option>
          {{end}}
        </select>
        <span class="mt-1.5 block text-xs text-slate-400">Produk hanya akan muncul pada PM yang berada di outlet
          ini.</span>
      </label>
      <label class="block text-sm font-medium text-slate-700">Barcode
        <input name="barcode" required value="{{.Product.Barcode}}" inputmode="numeric"
          class="mt-2 w-full rounded-xl border border-slate-300 px-3.5 py-3 font-mono text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      </label>
      <label class="block text-sm font-medium text-slate-700">PLU/SKU
        <input name="code" required value="{{.Product.Code}}"
          class="mt-2 w-full rounded-xl border border-slate-300 px-3.5 py-3 font-mono text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      </label>
      <label class="block text-sm font-medium text-slate-700 md:col-span-2">Nama Produk Resmi
        <input name="name" required value="{{.Product.Name}}"
          class="mt-2 w-full rounded-xl border border-slate-300 px-3.5 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      </label>
      <label class="block text-sm font-medium text-slate-700 md:col-span-2">Kategori Produk
        <select name="category_id" required
          class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
          {{range .Categories}}<option value="{{.ID}}" {{if and $.Product.Category (eq .ID
            $.Product.Category.ID)}}selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </label>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50/50 px-6 py-4">
      <span class="text-xs text-slate-500">Perubahan akan dicatat di audit log.</span>
      <div class="flex gap-2"><a href="/master-data"
          class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Batal</a><button
          class="rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700">Simpan
          Perubahan</button></div>
    </div>
  </form>
</div>
{{end}}
