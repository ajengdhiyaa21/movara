{{define "content"}}
<div class="mx-auto max-w-3xl"><div class="flex flex-wrap items-end justify-between gap-4"><div><a href="/kelola" class="text-sm font-medium text-blue-600">Kelola Outlet &amp; PM</a><h1 class="mt-2 text-2xl font-bold">Tambah Akun PM</h1><p class="mt-1 text-sm text-slate-500">Buat akun dan tempatkan PM ke outlet serta kategori yang sesuai.</p></div><a href="/kelola" class="inline-flex items-center rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">&larr; Kembali</a></div><form method="post" action="/kelola/pm" class="mt-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><div class="grid gap-5 sm:grid-cols-2"><label class="text-sm font-medium sm:col-span-2">Nama Lengkap<input name="name" required class="mt-2 w-full rounded-xl border px-3.5 py-3"></label><label class="text-sm font-medium">Username<input name="username" required class="mt-2 w-full rounded-xl border px-3.5 py-3"></label><label class="text-sm font-medium">Password<input name="password" type="password" placeholder="Kosong = default" class="mt-2 w-full rounded-xl border px-3.5 py-3"></label><input type="hidden" name="role" value="pm"><label class="text-sm font-medium">Outlet<select name="outlet_id" required class="mt-2 w-full rounded-xl border px-3.5 py-3">{{range .Outlets}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label><label class="text-sm font-medium">Kategori PM<select name="category_id" required class="mt-2 w-full rounded-xl border px-3.5 py-3">{{range .Categories}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label></div><div class="mt-6 flex justify-end gap-2"><a href="/kelola" class="rounded-xl border bg-white px-4 py-2.5 text-sm">Batal</a><button class="rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white">Simpan Akun PM</button></div></form></div>
{{end}}
